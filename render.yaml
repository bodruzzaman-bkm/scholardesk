# ScholarDesk on Render — the free-tier deployment.
#
# No credit card is needed for any of this.
#
# Render's free web services have no persistent disk, so the database moves
# off the container to a managed Postgres, created below.
#
# Uploaded PDFs stay on the container, deliberately. Object storage was tried
# here and removed: the app does not read the default disk. Every PDF path
# goes through Storage::disk('public') explicitly — PaperService writes it,
# ExportService reads it, and PdfTextService calls ->path() on it, which only
# a local disk implements. So FILESYSTEM_DISK never moved an upload anywhere;
# setting it to s3 only sent the entrypoint down a branch that skips the
# public/storage symlink, and every PDF 404'd in the reader. It is 'public'
# below so that the symlink is made and uploads are actually served.
#
# The cost of that is honest and worth knowing: the container's filesystem is
# rebuilt from the image on every restart, so a PDF uploaded during the demo
# is gone once the service sleeps. Papers, notes, highlights, collections and
# comments all live in Postgres and do survive — it is only the PDF bytes that
# do not.
#
# Everything else — the Dockerfile, the entrypoint, the app — is shared with
# the Fly deployment, where a real volume at /data keeps the uploads too.
#
# Two things to know about the free tier before you demo:
#   * a free service sleeps after inactivity, so the first request after a
#     quiet spell takes ~30-60s to wake. Open the link a minute early.
#   * free Postgres instances expire. Check the current term in the Render
#     dashboard and plan a dump before it lapses.

services:
  - type: web
    name: scholardesk
    runtime: docker
    plan: free
    region: singapore          # nearest to Bangladesh; change if you prefer
    dockerfilePath: ./Dockerfile

    # Render sends traffic to $PORT, which the entrypoint honours.
    healthCheckPath: /

    envVars:
      - key: APP_NAME
        value: ScholarDesk
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr           # Render collects stdout/stderr

      # Generated once by Render and then kept. Losing it makes every existing
      # session and every encrypted column unreadable.
      - key: APP_KEY
        generateValue: true

      # Set this to the service's own URL after the first deploy. Laravel uses
      # it to build absolute links in notification emails and password resets.
      - key: APP_URL
        sync: false

      # --- Database ------------------------------------------------------
      - key: DB_CONNECTION
        value: pgsql
      # DB_URL, not DATABASE_URL: config/database.php reads env('DB_URL') for
      # the pgsql connection, and Laravel parses the postgres:// string from it.
      - key: DB_URL
        fromDatabase:
          name: scholardesk-db
          property: connectionString

      # Sessions, cache and queue all sit in the database, so they follow it
      # to Postgres automatically.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      # sync, not database: indexing runs inline, so there is no worker to run
      # and no second service to pay for.
      - key: QUEUE_CONNECTION
        value: sync

      # --- Uploaded PDFs ---------------------------------------------------
      # 'public', not 's3'. See the note at the top of this file: the app
      # addresses Storage::disk('public') directly, so this value does not
      # choose where a PDF goes — it chooses whether the entrypoint links
      # public/storage at the upload directory. Without that link the files
      # are written but never served.
      - key: FILESYSTEM_DISK
        value: public

      # --- Demo data --------------------------------------------------------
      # Fills the deployment with a worked library on first boot, so whoever
      # opens the URL sees the application rather than an empty account. The
      # sign-in details are in docs/deploy-render.md and are not secret —
      # set this to false for anything but a demonstration.
      - key: DEMO_SEED
        value: "true"

      # --- AI --------------------------------------------------------------
      # Semantic search and related papers work without this; summaries,
      # Q&A and review drafts report "not configured" until it is set.
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b

      # --- Mail ------------------------------------------------------------
      # failover = smtp then log, so a missing app password degrades to the
      # log rather than 500-ing password reset.
      - key: MAIL_MAILER
        value: failover
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false             # a Google App Password, not the account one
      - key: MAIL_FROM_ADDRESS
        sync: false

databases:
  - name: scholardesk-db
    plan: free
    databaseName: scholardesk
    user: scholardesk
