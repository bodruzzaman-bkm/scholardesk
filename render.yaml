# ScholarDesk on Render — the free-tier deployment.
#
# No credit card is needed for any of this, and no managed database either.
#
# There was a Postgres here, declared as a `databases:` block with plan: free,
# and the blueprint would not apply with it. That is the whole reason it is
# gone. The replacement is not a workaround so much as the better fit for what
# this deployment actually is:
#
# A free web service has no persistent disk. Its filesystem is rebuilt from
# the image every time it wakes, so a Postgres bought durability for the rows
# while the uploaded PDFs beside them still evaporated — half-persistent, and
# the half that survived was the half nobody would miss after a demonstration.
# Committing to ephemeral makes the whole thing consistent: SQLite on the
# container, seeded from scratch on every boot by DemoSeeder, so the service
# comes up with the same worked library every single time. Nothing to expire,
# nothing to wire, nothing to run out of a free-tier quota.
#
# What that costs: anything typed into the live site is gone at the next
# restart. For a demonstration that is close to a feature — the URL is never
# in a half-edited state — but it is not storage, and must not be treated as
# any.
#
# Uploaded PDFs stay on the container too. Object storage was tried and
# removed: the app does not read the default disk. Every PDF path goes through
# Storage::disk('public') explicitly — PaperService writes it, ExportService
# reads it, and PdfTextService calls ->path() on it, which only a local disk
# implements. So FILESYSTEM_DISK never moved an upload anywhere; setting it to
# s3 only sent the entrypoint down a branch that skips the public/storage
# symlink, and every PDF 404'd in the reader. It is 'public' below so that the
# symlink is made and uploads are actually served.
#
# The Dockerfile and entrypoint are shared with the Fly deployment, where a
# real volume at /data keeps both the database and the uploads. Nothing here
# is Render-specific, and the image runs unprivileged, so it ports to any host
# that will run a container.
#
# One thing to know before you demo: a free service sleeps after inactivity,
# so the first request after a quiet spell takes ~30-60s to wake. Open the
# link a minute early.

services:
  - type: web
    name: scholardesk
    runtime: docker
    plan: free
    region: singapore          # nearest to Bangladesh; change if you prefer
    dockerfilePath: ./Dockerfile

    # Render sends traffic to $PORT, which the entrypoint honours.
    #
    # /up rather than /: it is the health endpoint Laravel registers in
    # bootstrap/app.php, and it answers 200 without rendering a view, opening
    # a session or touching the database. / happens to return 200 too, but it
    # renders the welcome page to do it, which makes the check sensitive to
    # things that have nothing to do with whether the process is alive.
    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: ScholarDesk
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr           # Render collects stdout/stderr

      # Set by hand, and it must be a Laravel key: "base64:" followed by 32
      # base64-encoded bytes, from `php artisan key:generate --show`.
      #
      # This was generateValue: true, which does not work. Render's generated
      # value is a random string of its own choosing, and Laravel's Encrypter
      # measures the key against the cipher — AES-256-CBC wants exactly 32
      # bytes — so it threw "Unsupported cipher or incorrect key length" while
      # constructing the encrypter. That happens inside the cookie middleware,
      # so every page 500'd while /up, which needs neither cookies nor a
      # session, answered 200 and made the service look healthy.
      - key: APP_KEY
        sync: false

      # Set this to the service's own URL after the first deploy. Laravel uses
      # it to build absolute links in notification emails and password resets.
      - key: APP_URL
        sync: false

      # --- Database ------------------------------------------------------
      # SQLite on the container, rebuilt and reseeded on every boot. The
      # entrypoint creates the file when DB_CONNECTION is sqlite, and
      # DB_DATABASE has to name it explicitly or config/database.php falls
      # back to database_path('database.sqlite') inside the image.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /data/database.sqlite
      - key: DATA_DIR
        value: /data

      # Sessions and cache live in the database, which is now the same
      # ephemeral file as everything else — so a restart signs everyone out.
      # That is correct for this deployment: the accounts it signs you back in
      # with are seeded and their password is documented.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      # sync, not database: indexing runs inline, so there is no worker to run
      # and no second service to pay for.
      - key: QUEUE_CONNECTION
        value: sync

      # --- Uploaded PDFs ---------------------------------------------------
      # 'public', not 's3'. See the note at the top of this file: the app
      # addresses Storage::disk('public') directly, so this value does not
      # choose where a PDF goes — it chooses whether the entrypoint links
      # public/storage at the upload directory. Without that link the files
      # are written but never served.
      - key: FILESYSTEM_DISK
        value: public

      # --- Demo data --------------------------------------------------------
      # Fills the deployment with a worked library on first boot, so whoever
      # opens the URL sees the application rather than an empty account. The
      # sign-in details are in docs/deploy-render.md and are not secret —
      # set this to false for anything but a demonstration.
      - key: DEMO_SEED
        value: "true"

      # --- AI --------------------------------------------------------------
      # Semantic search and related papers work without this; summaries,
      # Q&A and review drafts report "not configured" until it is set.
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b

      # --- Mail ------------------------------------------------------------
      # failover = smtp then log, so a broken mailer degrades to the log
      # rather than 500-ing password reset.
      #
      # Ethereal rather than Gmail. Gmail SMTP refuses an account password and
      # wants an App Password, which only exists once 2-Step Verification is on
      # a personal Google account — a credential nobody can mint for a shared
      # demo. Ethereal is a throwaway capture mailbox: it accepts mail over
      # real SMTP with real authentication and publishes it at
      # https://ethereal.email instead of delivering onward. It also accepts
      # any recipient, which is what makes the seeded @scholardesk.demo
      # accounts usable — Gmail could never have delivered to a fake TLD, so
      # the demo accounts and real delivery were always mutually exclusive.
      #
      # The credentials below are in the repo deliberately. They belong to a
      # disposable mailbox tied to no account, holding nothing, protecting
      # nothing; the blast radius of leaking them is that a stranger reads
      # ScholarDesk's own test mail. Before this ever carries real mail, move
      # MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM_ADDRESS back to `sync: false`
      # and set them in the dashboard.
      # resend, not smtp — because SMTP cannot work here at all.
      #
      # Render's free instances block outbound traffic to ports 25, 465 and
      # 587, which is every port an SMTP server listens on. The connection is
      # dropped rather than refused, so it hangs instead of failing, and
      # `php artisan serve` is single-process: one request stuck on a mail
      # socket stops the site answering anything until the platform restarts
      # it. Sending mail over SMTP from a free instance took the service down.
      #
      # No SMTP provider avoids that — the port is the problem, not the host.
      # Resend does, by not using SMTP: it takes the message over its HTTPS
      # API on 443, which is not blocked. config/mail.php already declared the
      # transport; resend/resend-php is now required so it can be built.
      #
      # RESEND_API_KEY is the only thing left to set, in the dashboard. Until
      # it is, MailService::isConfigured() reports the mailer as unconfigured
      # and Settings says so in as many words, rather than showing green over
      # a transport that cannot send.
      #
      # Two limits of a Resend account with no verified domain:
      #   - the sender must be onboarding@resend.dev, hence MAIL_FROM_ADDRESS
      #   - it will only deliver to the address the account was opened with,
      #     so the seeded @scholardesk.demo users cannot receive. Register an
      #     account on the site with that address to see mail arrive.
      # Verifying a domain in the Resend dashboard lifts both.
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: onboarding@resend.dev

      # Unused while MAIL_MAILER is resend, and kept deliberately. These are
      # working Ethereal credentials: a throwaway capture mailbox that accepts
      # mail over real SMTP and publishes it at https://ethereal.email instead
      # of delivering onward. On any paid instance, or locally, setting
      # MAIL_MAILER=failover is the entire change needed to use them.
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp.ethereal.email
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: rxv6h3v4oupq45el@ethereal.email
      - key: MAIL_PASSWORD
        value: 4G7uYRmSTrygdaS8kw
